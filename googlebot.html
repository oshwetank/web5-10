<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googlebot — WebGL Experiment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080c1e; overflow: hidden; }
        canvas { display: block; }

        #hud {
            position: fixed; top: 24px; left: 50%;
            transform: translateX(-50%);
            text-align: center; pointer-events: none; user-select: none;
        }
        #logo {
            font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;
            font-size: 52px; font-weight: 700; line-height: 1;
        }
        .b { color: #4285F4; } .r { color: #EA4335; }
        .y { color: #FBBC05; } .g { color: #34A853; }
        .w { color: rgba(255,255,255,0.9); }
        #tagline {
            margin-top: 8px; color: rgba(255,255,255,0.3);
            font-family: monospace; font-size: 11px;
            letter-spacing: 4px; text-transform: uppercase;
        }

        #url-display {
            position: fixed; bottom: 54px; left: 50%;
            transform: translateX(-50%);
            font-family: monospace; font-size: 11px;
            color: rgba(66,133,244,0.55); letter-spacing: 0.5px;
            pointer-events: none; transition: opacity 0.4s;
            white-space: nowrap;
        }
        #footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: center; gap: 32px;
            padding: 18px; pointer-events: none; user-select: none;
        }
        .status {
            display: flex; align-items: center; gap: 8px;
            font-family: monospace; font-size: 11px;
            color: rgba(255,255,255,0.25); letter-spacing: 1px;
        }
        .dot { width: 5px; height: 5px; border-radius: 50%; }
        .dot-b { background: #4285F4; animation: blink 1.4s ease-in-out infinite; }
        .dot-g { background: #34A853; animation: blink 1.4s ease-in-out infinite 0.7s; }
        @keyframes blink {
            0%,100%{ opacity:.3; transform:scale(1); }
            50%{ opacity:1; transform:scale(1.5); }
        }
    </style>
</head>
<body>

<div id="hud">
    <div id="logo">
        <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span><span class="w">bot</span>
    </div>
    <div id="tagline">WebGL &middot; Three.js &middot; Experiment</div>
</div>

<div id="url-display">Crawling: https://www.example.com/</div>

<div id="footer">
    <div class="status"><div class="dot dot-b"></div><span>INDEXING</span></div>
    <div class="status"><div class="dot dot-g"></div><span>CRAWLING THE WEB</span></div>
    <div class="status"><span style="color:rgba(255,255,255,0.12)">drag · scroll · explore</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c1e);
scene.fog = new THREE.FogExp2(0x080c1e, 0.022);

// ── Camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2.5, 11);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.87;

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2060, 2.2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-8, right:8, top:12, bottom:-8, near:1, far:45 });
scene.add(sun);

scene.add(Object.assign(new THREE.DirectionalLight(0x4080ff, 0.7), { position: new THREE.Vector3(-5, 2, -3) }));

const lBlue  = new THREE.PointLight(0x4285F4, 5, 20);
const lRed   = new THREE.PointLight(0xEA4335, 4, 16);
const lGreen = new THREE.PointLight(0x34A853, 4, 16);
scene.add(lBlue, lRed, lGreen);

// ── Materials ─────────────────────────────────────────────────────────────────
const std = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, ...opts });

const M = {
    body:     std(0xe8eaed, { metalness:.25, roughness:.45 }),
    metal:    std(0x9aa0a6, { metalness:.85, roughness:.20 }),
    dark:     std(0x3c4043, { metalness:.90, roughness:.15 }),
    chrome:   std(0xc8d0d8, { metalness:.95, roughness:.05 }),
    blue:     std(0x4285F4, { metalness:.1, roughness:.5, emissive:0x1a3080, emissiveIntensity:.35 }),
    red:      std(0xEA4335, { metalness:.1, roughness:.5 }),
    yellow:   std(0xFBBC05, { metalness:.1, roughness:.5 }),
    green:    std(0x34A853, { metalness:.1, roughness:.5 }),
    visor:    std(0x0d2040, { metalness:.6, roughness:.0, transparent:true, opacity:.80 }),
    eyeBlue:  std(0x4285F4, { emissive:0x4285F4, emissiveIntensity:2.5, roughness:0 }),
    eyeRed:   std(0xEA4335, { emissive:0xEA4335, emissiveIntensity:2.5, roughness:0 }),
    antTip:   std(0xEA4335, { emissive:0xEA4335, emissiveIntensity:3.0, roughness:0 }),
    platform: std(0x101828, { metalness:.9, roughness:.1 }),
};

// ── Geometry helpers ──────────────────────────────────────────────────────────
const mkBox = (w,h,d,m) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
    mesh.castShadow = mesh.receiveShadow = true;
    return mesh;
};
const mkSphere = (r,m,s=24) => {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r,s,s), m);
    mesh.castShadow = true;
    return mesh;
};
const mkCyl = (rt,rb,h,m,s=16) => {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s), m);
    mesh.castShadow = true;
    return mesh;
};
const mkTorus = (r,t,m,s=48) => new THREE.Mesh(new THREE.TorusGeometry(r,t,8,s), m);

// ── Robot (outer refs for animation) ─────────────────────────────────────────
const robot = new THREE.Group();
scene.add(robot);

let treadL, treadR, headGroup, antennaRing, antennaTip;

function buildRobot() {
    // ─ Treads ─────────────────────────────────────────────────────────────────
    const makeTread = (xPos) => {
        const g = new THREE.Group();
        const body = mkCyl(0.38, 0.38, 1.1, M.dark, 8);
        body.rotation.z = Math.PI / 2;
        g.add(body);
        for (let i = 0; i < 8; i++) {
            const a = (i/8)*Math.PI*2;
            const strip = mkBox(1.15, 0.07, 0.13, M.metal);
            strip.position.set(0, Math.sin(a)*0.38, Math.cos(a)*0.38);
            body.add(strip);
        }
        [-0.57, 0.57].forEach(x => {
            const hub = mkCyl(0.2, 0.2, 0.06, M.chrome, 16);
            hub.rotation.z = Math.PI/2;
            hub.position.x = x;
            g.add(hub);
        });
        g.position.set(xPos, -2.6, 0);
        return { group: g, body };
    };
    const tL = makeTread(-0.72);
    const tR = makeTread( 0.72);
    treadL = tL.body;
    treadR = tR.body;
    robot.add(tL.group, tR.group);

    const axle = mkCyl(0.08, 0.08, 1.5, M.metal);
    axle.rotation.z = Math.PI/2;
    axle.position.y = -2.6;
    robot.add(axle);

    // ─ Legs ───────────────────────────────────────────────────────────────────
    [-0.58, 0.58].forEach(x => {
        robot.add(Object.assign(mkCyl(0.23, 0.27, 0.7, M.metal), { position: new THREE.Vector3(x,-1.9,0) }));
        robot.add(Object.assign(mkSphere(0.28, M.dark, 14), { position: new THREE.Vector3(x,-1.53,0) }));
        robot.add(Object.assign(mkCyl(0.22, 0.25, 0.55, M.body), { position: new THREE.Vector3(x,-1.65,0) }));
    });

    // ─ Waist ──────────────────────────────────────────────────────────────────
    const waist = mkBox(1.02, 0.32, 0.62, M.metal);
    waist.position.y = -1.12;
    robot.add(waist);

    const waistRing = mkTorus(0.52, 0.042, M.blue, 64);
    waistRing.position.y = -0.96;
    robot.add(waistRing);

    // ─ Body ───────────────────────────────────────────────────────────────────
    const bodyG = new THREE.Group();

    const bodyMain = mkBox(1.45, 1.55, 0.82, M.body);
    bodyG.add(bodyMain);

    // Google color side panels
    const panelL = mkBox(0.07, 1.35, 0.74, M.blue);  panelL.position.x = -0.76; bodyG.add(panelL);
    const panelR = mkBox(0.07, 1.35, 0.74, M.red);   panelR.position.x =  0.76; bodyG.add(panelR);
    const panelT = mkBox(1.45, 0.07, 0.74, M.yellow); panelT.position.y =  0.81; bodyG.add(panelT);
    const panelB = mkBox(1.45, 0.07, 0.74, M.green);  panelB.position.y = -0.81; bodyG.add(panelB);

    // Chest screen
    const screen = mkBox(0.76, 0.76, 0.07, M.dark);
    screen.position.set(0, 0.12, 0.445);
    bodyG.add(screen);

    // "G" logo on chest
    const gDefs = [
        { sz:[0.33,0.08,0.07], pos:[ 0.0,  0.32, 0.485] },  // top bar
        { sz:[0.08,0.48,0.07], pos:[-0.22,  0.08, 0.485] },  // left bar
        { sz:[0.33,0.08,0.07], pos:[ 0.0, -0.18, 0.485] },  // bottom bar
        { sz:[0.20,0.08,0.07], pos:[ 0.1,  0.08, 0.485] },  // crossbar
        { sz:[0.08,0.20,0.07], pos:[ 0.21, 0.18, 0.485] },  // right arm
    ];
    gDefs.forEach(({ sz, pos }) => {
        const p = mkBox(...sz, M.blue);
        p.position.set(...pos);
        bodyG.add(p);
    });

    // Back vents
    for (let i = 0; i < 5; i++) {
        const v = mkBox(1.22, 0.07, 0.04, M.metal);
        v.position.set(0, -0.45 + i*0.22, -0.43);
        bodyG.add(v);
    }

    robot.add(bodyG);

    // ─ Shoulders ──────────────────────────────────────────────────────────────
    [-1.0, 1.0].forEach(x => {
        const sh = mkSphere(0.32, M.dark, 14);
        sh.position.set(x, 0.72, 0);
        robot.add(sh);
    });

    // ─ Arms ───────────────────────────────────────────────────────────────────
    [[-1.12,-1],[1.12,1]].forEach(([x,dir]) => {
        const ua = mkCyl(0.19, 0.16, 0.85, M.body);
        ua.position.set(x, 0.15, 0);
        ua.rotation.z = dir * 0.1;
        robot.add(ua);

        const elb = mkSphere(0.19, M.metal, 12);
        elb.position.set(x, -0.4, 0.05);
        robot.add(elb);

        const fa = mkCyl(0.16, 0.13, 0.7, M.metal);
        fa.position.set(x + dir*0.06, -0.88, 0.1);
        fa.rotation.z = dir * 0.18;
        robot.add(fa);

        const hand = mkSphere(0.19, M.dark, 10);
        hand.position.set(x + dir*0.08, -1.32, 0.1);
        robot.add(hand);
    });

    // ─ Neck ───────────────────────────────────────────────────────────────────
    const neck = mkCyl(0.22, 0.28, 0.32, M.metal);
    neck.position.y = 1.12;
    robot.add(neck);

    // ─ Head ───────────────────────────────────────────────────────────────────
    headGroup = new THREE.Group();
    headGroup.position.y = 1.68;

    const headSphere = mkSphere(0.8, M.body, 32);
    headGroup.add(headSphere);

    // Head band (blue torus)
    const hBand = mkTorus(0.81, 0.044, M.blue, 64);
    hBand.rotation.x = Math.PI/2;
    hBand.position.y = 0.14;
    headGroup.add(hBand);

    // Ear side panels
    const earL = mkBox(0.07, 0.42, 0.38, M.blue); earL.position.x = -0.82; headGroup.add(earL);
    const earR = mkBox(0.07, 0.42, 0.38, M.red);  earR.position.x =  0.82; headGroup.add(earR);

    // Visor (transparent ellipsoid face shield)
    const visor = mkSphere(1, M.visor, 32);
    visor.scale.set(0.55, 0.38, 0.26);
    visor.position.set(0, 0.1, 0.6);
    headGroup.add(visor);

    // Eye sockets
    const sockL = mkSphere(0.19, M.dark, 14); sockL.position.set(-0.26, 0.14, 0.68); headGroup.add(sockL);
    const sockR = mkSphere(0.19, M.dark, 14); sockR.position.set( 0.26, 0.14, 0.68); headGroup.add(sockR);

    // Eyes (glowing)
    const eyeL = mkSphere(0.13, M.eyeBlue, 14); eyeL.position.set(-0.26, 0.14, 0.76); headGroup.add(eyeL);
    const eyeR = mkSphere(0.13, M.eyeRed,  14); eyeR.position.set( 0.26, 0.14, 0.76); headGroup.add(eyeR);

    // ─ Antenna ────────────────────────────────────────────────────────────────
    const antG = new THREE.Group();
    antG.position.set(0, 0.8, 0);

    antG.add(Object.assign(mkCyl(0.08, 0.11, 0.22, M.metal, 8), { position: new THREE.Vector3(0, 0.11, 0) }));
    antG.add(Object.assign(mkCyl(0.045, 0.08, 0.3, M.metal, 8), { position: new THREE.Vector3(0, 0.37, 0) }));

    antennaTip = mkSphere(0.1, M.antTip, 12);
    antennaTip.position.y = 0.62;
    antG.add(antennaTip);

    antennaRing = mkTorus(0.2, 0.026, M.blue);
    antennaRing.position.y = 0.37;
    antG.add(antennaRing);

    headGroup.add(antG);
    robot.add(headGroup);
}

buildRobot();

// ── Platform ──────────────────────────────────────────────────────────────────
const plat = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 2.9, 0.1, 64), M.platform);
plat.position.y = -3.08;
plat.receiveShadow = true;
scene.add(plat);

[{ r:.9, m:M.blue }, { r:1.55, m:M.green }, { r:2.25, m:M.yellow }].forEach(({ r, m }) => {
    const ring = mkTorus(r, 0.016, m, 64);
    ring.rotation.x = Math.PI/2;
    ring.position.y = -3.01;
    scene.add(ring);
});

// ── Web graph (background) ────────────────────────────────────────────────────
const webGroup = new THREE.Group();
scene.add(webGroup);

const NODE_N = 48, CONN_D = 7.5;
const nodePos = [], nodeMeshes = [];
const nMats = [
    std(0x4285F4, { emissive:0x4285F4, emissiveIntensity:1 }),
    std(0xEA4335, { emissive:0xEA4335, emissiveIntensity:1 }),
    std(0xFBBC05, { emissive:0xFBBC05, emissiveIntensity:1 }),
    std(0x34A853, { emissive:0x34A853, emissiveIntensity:1 }),
];

for (let i = 0; i < NODE_N; i++) {
    const theta = Math.random()*Math.PI*2;
    const phi   = Math.acos(2*Math.random()-1);
    const r     = 11 + Math.random()*9;
    const p = new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    nodePos.push(p);
    const nm = mkSphere(0.06 + Math.random()*0.18, nMats[i%4], 8);
    nm.position.copy(p);
    webGroup.add(nm);
    nodeMeshes.push(nm);
}

// Build edges (shared by LineSegments and packets)
const edgePairs = [];
const edgeVerts = [];
for (let i = 0; i < NODE_N; i++) {
    for (let j = i+1; j < NODE_N; j++) {
        if (nodePos[i].distanceTo(nodePos[j]) < CONN_D && Math.random() > 0.25) {
            edgePairs.push([nodePos[i], nodePos[j]]);
            edgeVerts.push(nodePos[i].x, nodePos[i].y, nodePos[i].z, nodePos[j].x, nodePos[j].y, nodePos[j].z);
        }
    }
}
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgeVerts, 3));
webGroup.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color:0x4285F4, transparent:true, opacity:.12 })));

// ── Data packets ──────────────────────────────────────────────────────────────
const packets = Array.from({ length: 22 }, (_, k) => {
    const [from, to] = edgePairs[Math.floor(Math.random()*edgePairs.length)];
    const mesh = mkSphere(0.07, nMats[k%4], 6);
    webGroup.add(mesh);
    return { mesh, from, to, t: Math.random(), speed: 0.003 + Math.random()*0.006 };
});

// ── Stars ─────────────────────────────────────────────────────────────────────
const N_STARS = 2500;
const sPos = new Float32Array(N_STARS*3), sCol = new Float32Array(N_STARS*3);
for (let i = 0; i < N_STARS; i++) {
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 65 + Math.random()*90;
    sPos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    sPos[i*3+1] = r*Math.cos(ph);
    sPos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    const t = Math.random();
    sCol[i*3]=0.7+t*.3; sCol[i*3+1]=0.7+t*.3; sCol[i*3+2]=1;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
starGeo.setAttribute('color',    new THREE.Float32BufferAttribute(sCol, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size:.18, vertexColors:true, transparent:true, opacity:.65 })));

// ── Mouse ─────────────────────────────────────────────────────────────────────
const mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

// ── URL ticker ────────────────────────────────────────────────────────────────
const urls = [
    'https://en.wikipedia.org/wiki/Web_crawler',
    'https://developers.google.com/search/docs/crawling-indexing/googlebot',
    'https://threejs.org/docs/#manual/en/introduction/Installation',
    'https://webglfundamentals.org/webgl/lessons/webgl-fundamentals.html',
    'https://www.example.com/products/page/42?ref=googlebot',
    'https://blog.example.com/ai/search-engine-2025',
    'https://api.example.com/v3/search?q=webgl+three.js&limit=100',
    'https://github.com/mrdoob/three.js/blob/dev/src/core/Object3D.js',
];
let urlIdx = 0;
const urlEl = document.getElementById('url-display');
setInterval(() => {
    urlIdx = (urlIdx + 1) % urls.length;
    urlEl.style.opacity = '0';
    setTimeout(() => {
        urlEl.textContent = 'Crawling: ' + urls[urlIdx];
        urlEl.style.opacity = '1';
    }, 380);
}, 2900);

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ── Animate ───────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

(function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Robot hover & sway
    robot.position.y = Math.sin(t * 0.72) * 0.14;
    robot.rotation.y = Math.sin(t * 0.29) * 0.07;

    // Tread rolls
    treadL.rotation.x += 0.024;
    treadR.rotation.x += 0.024;

    // Antenna tip blink
    M.antTip.emissiveIntensity = 1.5 + Math.abs(Math.sin(t * 3.6)) * 3.8;

    // Antenna ring spin
    antennaRing.rotation.x += 0.045;
    antennaRing.rotation.z += 0.022;

    // Eye pulse (out of phase)
    M.eyeBlue.emissiveIntensity = 1.8 + Math.sin(t * 2.2)           * 0.9;
    M.eyeRed.emissiveIntensity  = 1.8 + Math.sin(t * 2.2 + Math.PI) * 0.9;

    // Head follows mouse
    headGroup.rotation.y = mouse.x *  0.55;
    headGroup.rotation.x = mouse.y * -0.30;

    // Color lights orbit
    lBlue.position.set( Math.sin(t*.44)*6,  3, Math.cos(t*.44)*6);
    lRed.position.set(  Math.sin(t*.64+2)*5,-1, Math.cos(t*.64+2)*5);
    lGreen.position.set(Math.sin(t*.54+4)*5, 4, Math.cos(t*.54+4)*5);

    // Web graph drift
    webGroup.rotation.y += 0.0008;
    webGroup.rotation.x  = Math.sin(t * 0.04) * 0.07;

    // Node pulse
    nodeMeshes.forEach((n, i) => n.scale.setScalar(0.8 + 0.45 * Math.abs(Math.sin(t*1.5 + i*0.7))));

    // Packets travel
    packets.forEach(p => {
        p.t += p.speed;
        if (p.t > 1) p.t = 0;
        p.mesh.position.lerpVectors(p.from, p.to, p.t);
    });

    controls.update();
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
